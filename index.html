<!DOCTYPE html>
<html>
<head>
  <meta charset="UTF-8" />
  <title>Mawaqit</title>
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <style>
    html, body {
      margin: 0;
      padding: 0;
      height: 100%;
      overflow: hidden;
      background: black;
      font-family: Arial, sans-serif;
    }

    /* Fullscreen iframe */
    #view {
      width: 100vw;
      height: 100vh;
      border: 0;
      display: block;
    }

    /* Container for the hidden dropdown bar */
    .overlay-wrap {
      position: fixed;
      top: 0;
      left: 0;
      right: 0;
      z-index: 9999;
    }

    /* The thin "line" always visible */
    .top-line {
      height: 8px; /* thin line */
      background: rgba(0,0,0,0.20);
      backdrop-filter: blur(2px);
      cursor: pointer;
    }

    /* The actual dropdown panel (hidden by default) */
    .overlay {
      display: flex;
      gap: 10px;
      justify-content: center;
      padding: 12px;

      background: rgba(0,0,0,0.15);
      backdrop-filter: blur(2px);

      transform: translateY(-100%);
      transition: transform 220ms ease;
    }

    /* Show dropdown on hover (mouse) OR when opened (touch) */
    .overlay-wrap:hover .overlay,
    .overlay-wrap.open .overlay {
      transform: translateY(0);
    }

    /* Buttons */
    .btn {
      padding: 10px 18px;
      border-radius: 10px;
      border: 1px solid rgba(255,255,255,0.35);
      background: rgba(0,0,0,0.25);
      color: white;
      font-size: 16px;
      cursor: pointer;
      user-select: none;
    }
    .btn.active {
      background: rgba(255,255,255,0.20);
      border-color: rgba(255,255,255,0.6);
    }
  </style>
</head>
<body>

  <div class="overlay-wrap" id="overlayWrap">
    <div class="top-line" id="topLine" aria-label="Open menu"></div>

    <div class="overlay" id="overlayPanel">
      <button id="btnInteraktiv" class="btn active">Interaktiv</button>
      <button id="btnNachrichten" class="btn">Nachrichten</button>
    </div>
  </div>

  <iframe id="view"
    src="https://mawaqit.net/en/w/munchner-forum-fur-islam-mfi-muni-80331-germany?showOnly5PrayerTimes=0"
    frameborder="0"
    scrolling="no">
  </iframe>

  <script>
    const URL_INTERAKTIV =
      "https://mawaqit.net/en/w/munchner-forum-fur-islam-mfi-muni-80331-germany?showOnly5PrayerTimes=0";
    const URL_NACHRICHTEN =
      "https://mawaqit.net/de/messages/id/43543";

    const iframe = document.getElementById("view");
    const btnInteraktiv = document.getElementById("btnInteraktiv");
    const btnNachrichten = document.getElementById("btnNachrichten");

    const overlayWrap = document.getElementById("overlayWrap");
    const topLine = document.getElementById("topLine");

    function setActive(which) {
      const isInteraktiv = which === "interaktiv";
      btnInteraktiv.classList.toggle("active", isInteraktiv);
      btnNachrichten.classList.toggle("active", !isInteraktiv);
      iframe.src = isInteraktiv ? URL_INTERAKTIV : URL_NACHRICHTEN;
    }

    btnInteraktiv.addEventListener("click", (e) => {
      e.stopPropagation();
      setActive("interaktiv");
      overlayWrap.classList.remove("open");
    });

    btnNachrichten.addEventListener("click", (e) => {
      e.stopPropagation();
      setActive("nachrichten");
      overlayWrap.classList.remove("open");
    });

    // Touch / click: tap the thin line to open/close
    topLine.addEventListener("click", (e) => {
      e.stopPropagation();
      overlayWrap.classList.toggle("open");
    });

    // Tap anywhere else to close (for TV / touch)
    document.addEventListener("click", () => {
      overlayWrap.classList.remove("open");
    });
  </script>

</body>
</html>
